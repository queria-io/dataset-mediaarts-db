schema: main
name: manga_book_series
title: マンガ単行本シリーズ（書誌）
description: |-
  マンガ単行本のシリーズの書誌情報です。1 行が 1 シリーズで、タイトル・著者・出版者・レーベル・全巻数・初刊と最終巻の発行日を持ちます。

  - manga_book とは series_id で結合できます
keywords:
  - マンガ
  - シリーズ
  - 書誌
  - 出版
  - メディア芸術
sources:
  - path: https://mediaarts-db.artmuseums.go.jp/
fields:
  - name: series_id
    title: シリーズID
    description: シリーズの資料識別子（例 C253219）。manga_book.series_id と対応
  - name: title
    title: タイトル
  - name: title_kana
    title: タイトルヨミ
    description: ひらがな・カタカナ表記の読み
  - name: alternate_title
    title: 別タイトル
  - name: series_name
    title: シリーズ名
    description: このシリーズが所属する上位シリーズの名称
  - name: version
    title: 版表示
    description: 版・エディションの表示（例 "コミック版"）
  - name: creator_id
    title: 著者ID
    description: メディア芸術データベースの著者識別子（例 C61770）。複数の著者は " | " で連結する
  - name: creator_statement
    title: 著者表示
    description: 責任表示（例 "[著]尾玉なみえ"）
  - name: contributor
    title: その他の著者
  - name: original_work_creator
    title: 原作者
  - name: publisher_name
    title: 発行者名
  - name: publisher_name_kana
    title: 発行者名ヨミ
  - name: publisher_code
    title: 発行者コード
  - name: brand
    title: レーベル
    description: 叢書・レーベル名（例 "シリウスKC"）
  - name: brand_kana
    title: レーベルヨミ
  - name: date_published
    title: 出版日
    description: 初刊の出版日。YYYY / YYYY-MM / YYYY-MM-DD が混在する文字列
  - name: published_year
    title: 出版年
    description: 出版日から取り出した年
  - name: date_published_final
    title: 最終巻発行日
    description: 終刊したシリーズの最新巻の発行日。不明な桁は落としている
  - name: final_published_year
    title: 最終巻発行年
  - name: volume_count
    title: 全巻数
    description: シリーズを構成する単行本の件数
  - name: ndc
    title: NDC分類
  - name: content_rating
    title: レーティング
    description: 想定される年齢に基づく利用制限（例 "成年コミック"）
  - name: additional_genre
    title: サブジャンル
    description: 種別の下位分類（例 "短編集"）
  - name: language
    title: 言語
  - name: publication_place
    title: 発行地
  - name: description
    title: 概要
  - name: note
    title: 備考
  - name: source_url
    title: 詳細ページURL
    description: メディア芸術データベースの資料詳細ページ
