version: 2

models:
  - name: manga_book
    description: |
      マンガ単行本の書誌データ。日本国内で刊行されたマンガ単行本を1冊1レコードで収録し、
      タイトル・巻数・著者・出版者・レーベル・ISBN・出版年月・ページ数などを持つ。
      出典: メディア芸術データベース（MADB）データセット（マンガ単行本 cm101）。
      https://github.com/mediaarts-db/dataset
      メディア芸術データベースは独立行政法人国立美術館 国立アートリサーチセンター
      （旧 文化庁）が運営する。
    access: public
    columns:
      - name: book_id
      - name: title
      - name: title_kana
      - name: alternate_title
      - name: volume
      - name: volume_sort
      - name: series_id
      - name: series_name
      - name: creator_id
      - name: creator_statement
      - name: publisher_name
      - name: publisher_name_kana
      - name: publisher_code
      - name: brand
      - name: brand_kana
      - name: date_published
      - name: published_year
      - name: publication_place
      - name: language
      - name: isbn
      - name: jpno
      - name: ndc
      - name: product_id
      - name: pages
      - name: book_size
      - name: price
      - name: note
      - name: source_url
