spec_version: "0.1"
name: mediaarts_db
title: メディア芸術データベース
description: |-
  独立行政法人国立美術館 国立アートリサーチセンター（旧 文化庁）が運営する
  メディア芸術データベース（MADB）の書誌メタデータ。
  マンガ単行本・マンガ単行本シリーズ・マンガ雑誌各号の書誌情報
  （タイトル・巻号・著者・出版者・レーベル・ISBN・発行年月など）を収録する。
keywords:
  - マンガ
  - 書誌
  - 出版
  - 雑誌
  - ISBN
  - メディア芸術
homepage: https://github.com/queria-io/dataset-mediaarts-db
language: ja

licenses:
  - JP-MEDIAARTS-DB

sources:
  - title: メディア芸術データベース（MADB）
    path: https://mediaarts-db.artmuseums.go.jp/
  - title: メディア芸術データベース データセット（GitHub）
    path: https://github.com/mediaarts-db/dataset

contributors:
  - title: 独立行政法人国立美術館 国立アートリサーチセンター
    path: https://ncar.artmuseums.go.jp/
    roles: [rightsHolder]

temporal_coverage: { start: "1900", end: "2022" }
spatial_coverage: [JP]
update_frequency: yearly
cover: 📚

ai_context:
  instructions: |
    出版社・レーベル・著者・年ごとのマンガの刊行状況を調べるのに使う。
    manga_book は1行が1冊（巻）、manga_book_series は1行が1シリーズ、
    manga_magazine_issue は1行が1号。
    manga_book.series_id は manga_book_series.series_id と結合できる（33万冊のうち31万冊が対応する）。
    manga_magazine_issue.magazine_id は雑誌タイトル単位の識別子で、同じ雑誌の号がまとまる。
    日付は分野をまたいで表記が揺れる。date_published は YYYY / YYYY-MM / YYYY-MM-DD が
    混在する文字列なので、年で集計するときは published_year を使う。
    manga_book は33万冊のうち出版年が入っていないのが1万7千冊あるので、年別に数えるときは NULL を除く。
    出版年の下限には1900年より前の値も入っているが、これは書誌データ側の表記に由来する外れ値で、
    実質的な収録は20世紀以降。2022年より新しい巻はほとんど入っていない（元データの更新頻度による）。
    manga_magazine_issue は表紙表示に由来する year_displayed がほぼ全号に入っている一方、
    date_published は15万9千号にとどまるので、年別に数えるなら year_displayed を使う。
    ごく少数だが 0 や 9999 の外れ値が入る。収録は2018年までで、それ以降の号はほとんど無い。
    manga_book_series の date_published は初刊、date_published_final は終刊したシリーズの最終巻。
    どちらも欠けるシリーズが多い（初刊は13万件中6万件）ので、年別に数えるときは NULL を除く。
    manga_book の ISBN は29万件に付いているが、ISBN 以前の刊行物には無い。
    ISBN で名寄せすると古い巻が落ちる。
    manga_magazine_issue の発行者名は17万号中10万号にしか入っていない。
    収録はマンガ（単行本 cm101・単行本シリーズ cm104・雑誌各号 cm102）で、
    アニメ・ゲームは含まない。
  synonyms: [マンガ, 単行本, シリーズ, マンガ雑誌, 書誌, MADB, メディア芸術データベース]
  examples:
    - 出版社別の単行本の刊行数を年ごとに出したい
    - あるシリーズの巻を出版順に並べたい
    - レーベル別の刊行点数の推移が見たい
    - マンガ雑誌の創刊から終刊までの号数を数えたい
    - 巻数の多いシリーズを出版社別に並べたい

schemas:
  - name: main
    title: メイン
